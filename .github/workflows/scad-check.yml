name: check scad

on:
  push:
    paths:
      - "**/*.scad"
  pull_request:
    paths:
      - "**/*.scad"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/lint-scad.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y openscad
      - run: ./scripts/check-scad-syntax.sh
